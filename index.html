<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGIS Sebaran Kerapatan Mangrove Desa Tapak</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>🌿 WebGIS Sebaran Kerapatan Mangrove - Desa Tapak</header>
<div id="sidebar">
<h2>Informasi</h2>
<p>Peta ini menampilkan lokasi kajian mangrove di Desa Tapak, Kecamatan Tugu, Kota Semarang.</p>
<h3>Legenda</h3>
<div><span class="c red"></span>Sangat Padat</div>
<div><span class="c green"></span>Padat</div>
<div><span class="c yellow"></span>Sedang</div>
<div><span class="c blue"></span>Perairan</div>
<button id="openImg">Lihat Hasil Klasifikasi</button>
</div>
<div id="map"></div>

<div id="modal">
<div class="box">
<span id="close">&times;</span>
<img src="assets/mangrove.png" alt="Peta Mangrove">
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
